<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70" fill="none">
  <defs>
    <linearGradient id="ab_bag_grad_w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="ab_sparkle_grad_w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Shopping Bag Icon -->
  <g transform="translate(6, 4) scale(0.62)">
    <!-- Rounded Bag Base -->
    <rect x="14" y="26" width="72" height="64" rx="18" fill="url(#ab_bag_grad_w)" />
    <!-- Bag Handles -->
    <path d="M34 30 V20 C34 11.16 41.16 4 50 4 C58.84 4 66 11.16 66 20 V30" stroke="#047857" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M34 28 V20 C34 12.27 41.16 6 50 6 C58.84 6 66 12.27 66 20 V28" stroke="#34D399" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Inner Checkmark -->
    <path d="M32 58 L44 70 L68 44" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Sparkle Accent -->
    <path d="M74 15 L76.5 21.5 L83 24 L76.5 26.5 L74 33 L71.5 26.5 L65 24 L71.5 21.5 Z" fill="url(#ab_sparkle_grad_w)" />
  </g>

  <!-- Typography: ApnaBuy (White text for dark background) -->
  <text x="76" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.8">
    <tspan fill="#FFFFFF">Apna</tspan><tspan fill="#10B981">Buy</tspan>
  </text>

  <!-- Subtitle: ONLINE SHOPPING -->
  <text x="78" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="10.5" fill="#6EE7B7" letter-spacing="2">
    ONLINE SHOPPING
  </text>
</svg>

